<body class="p-noriteo">

    <!-- 이 페이지의 방식: 구획 나누기 — 놀이공원과 키즈카페 사진에서 지붕, 벽, 바닥이 될 부분을 오려 겹치지 않게 쌓아, 아무도 없는 하나의 놀이 공간처럼 짓는다. 아래로 내리면 원본 사진 -->
    <!-- class="gonggan"(공간) — 판의 비율을 고정하고, 조각의 위치·크기를 모두 %로 적었다.
         그래서 화면 폭이 바뀌어도 조각끼리 겹치지 않고 같은 틈을 유지한다.
         class="gureum"(구름)이 붙은 조각은 동그랗게 오린다 -->
    <main class="gonggan-teul">
        <div class="gonggan" style="aspect-ratio: 1200 / 839;">
            <!-- 지붕 -->
            <div class="jogak" style="left: 0.00%; top: 0.00%; width: 44.07%; height: 14.19%;">
                <img src="img/143.jpg" style="width: 100.0%; left: -0.0%; top: -0.0%;">
            </div>
            <div class="jogak" style="left: 44.91%; top: 0.00%; width: 55.09%; height: 14.19%;">
                <img src="img/165.jpg" style="width: 100.0%; left: -0.0%; top: -0.0%;">
            </div>
            <!-- 벽 -->
            <div class="jogak" style="left: 0.00%; top: 15.38%; width: 49.07%; height: 36.69%;">
                <img src="img/146.jpg" style="width: 151.5%; left: -27.3%; top: -13.0%;">
            </div>
            <div class="jogak gureum" style="left: 49.90%; top: 15.38%; width: 25.78%; height: 36.69%;">
                <img src="img/112.jpg" style="width: 204.1%; left: -26.5%; top: -23.1%;">
            </div>
            <div class="jogak" style="left: 76.51%; top: 15.38%; width: 23.49%; height: 36.69%;">
                <img src="img/150.jpg" style="width: 175.4%; left: -8.8%; top: -18.1%;">
            </div>
            <div class="jogak" style="left: 0.00%; top: 53.26%; width: 19.22%; height: 16.49%;">
                <img src="img/148.jpg" style="width: 125.0%; left: -18.8%; top: -12.5%;">
            </div>
            <div class="jogak gureum" style="left: 20.05%; top: 53.26%; width: 11.39%; height: 16.49%;">
                <img src="img/120.jpg" style="width: 500.0%; left: -125.0%; top: -148.1%;">
            </div>
            <div class="jogak" style="left: 32.27%; top: 53.26%; width: 36.15%; height: 16.49%;">
                <img src="img/145.jpg" style="width: 114.9%; left: -9.2%; top: -67.6%;">
            </div>
            <div class="jogak" style="left: 69.25%; top: 53.26%; width: 30.75%; height: 16.49%;">
                <img src="img/141.jpg" style="width: 100.0%; left: -0.0%; top: -90.0%;">
            </div>
            <!-- 바닥 -->
            <div class="jogak" style="left: 0.00%; top: 70.94%; width: 49.24%; height: 29.06%;">
                <img src="img/140.jpg" style="width: 100.0%; left: -0.0%; top: -81.8%;">
            </div>
            <div class="jogak" style="left: 50.08%; top: 70.94%; width: 22.01%; height: 29.06%;">
                <img src="img/144.jpg" style="width: 153.8%; left: -30.8%; top: -25.0%;">
            </div>
            <div class="jogak" style="left: 72.92%; top: 70.94%; width: 27.08%; height: 29.06%;">
                <img src="img/165.jpg" style="width: 172.4%; left: -0.0%; top: -72.4%;">
            </div>
        </div>
    </main>

    <!-- 아래로 내리면: 조각을 오려 온 원본 사진들 -->

</body>
